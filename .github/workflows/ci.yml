name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run tests (offline)
        env:
          # 单元测试用 monkeypatch 替换 litellm.completion，无需真实密钥；
          # 示例测试由 tests/test_examples.py 在子进程内自设 QUANTSENTINEL_LLM_MOCK=1。
          # 不在此处注入全局 mock：否则会切换到 MockCompletionBackend，
          # 使依赖 litellm.completion 注入的单元测试收不到响应而失败。
          LITELLM_OFFLINE_MODE: "true"
        run: uv run pytest --junitxml=pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest.xml
          if-no-files-found: ignore
