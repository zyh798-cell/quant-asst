name: Pages

# 部署静态前端（web/app）到 GitHub Pages。
# 只构建/上传前端产物：server/ 与 .env 不参与，无密钥泄漏面。
#
# 前置：仓库 Settings -> Pages -> Build and deployment -> Source = GitHub Actions。
#   configure-pages 的 enablement: true 作为兜底：权限足够时自动启用 Pages 站点，
#   避免因站点未创建而报 "Get Pages site failed / Not Found"。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      # enablement: true —— 站点未创建时自动启用（幂等），消除首跑
      # configure-pages HttpError: Not Found（Get Pages site failed）。
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          # 子路径部署：站点地址为 https://<owner>.github.io/quant-asst/
          VITE_BASE: /quant-asst/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
