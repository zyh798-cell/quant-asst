[project]
name = "quant_asst"
version = "0.1.0"
description = "QuantAsst - 多智能体协作的多市场量化研究引擎（仅用于教育与研究，不构成投资建议）"
readme = "README.md"
requires-python = ">=3.11.5"   # akshare>=1.20.46（美股接口更名）要求 Python>=3.11.5
license = { text = "MIT" }
dependencies = [
    # ---- Agent 编排与 LLM ----
    "langgraph>=0.2.60",          # 状态机编排（不用 LangChain 高层封装）
    "litellm>=1.50.0",            # 统一 LLM 调用，通过环境变量切换模型
    # ---- 配置与数据校验 ----
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.3.0",            # 结构化输出校验失败重试
    # ---- 行情数据（多市场）----
    "akshare>=1.20.46,<2",        # A股/港股/美股/期货 免费行情；1.20.46 起美股接口更名 stock_us_daily_sina
    "ccxt>=4.3.0",                # 加密货币交易所行情（7x24）
    # ---- 存储与计算 ----
    "duckdb>=1.0.0",              # 本地分析型查询
    "pyarrow>=17.0.0",            # Parquet 列式缓存
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # ---- 向量库（本地模式 + 中文向量化）----
    "qdrant-client[fastembed]>=1.9.0",
    # ---- 可视化 ----
    "plotly>=5.22.0",             # 静态 HTML 报告图表
    # ---- 沙箱 ----
    "docker>=7.0.0",              # Docker SDK：在容器内执行 LLM 生成代码
    # ---- CLI ----
    "typer>=0.12.0",
    "rich>=13.7.0",
    "psutil>=7.2.2",
    # ---- Web 接口层（server/，Step B）----
    "fastapi>=0.163.0",           # HTTP 接口 + Pydantic 校验
    "uvicorn>=0.54.0",            # ASGI 服务器（本地开发）
]

[project.optional-dependencies]
# Qlib 为可选增强（因子库/数据工作流）。pyqlib 对 numpy 版本有严格约束，
# 与主依赖的新版 numpy/pandas 存在冲突风险，故默认不安装；
# 回测主链路由自研事件引擎承担（沙箱内执行），Qlib 工作流见 Step 2 决策。
qlib = ["pyqlib>=0.9.0"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 扁平布局：按规格将各顶层目录声明为可安装包（tests/examples/var 不打包）
[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "tools", "data", "backtest", "report", "audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
