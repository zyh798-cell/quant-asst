  <rect x="730" y="566" width="56" height="4" rx="2" fill="var(--color-ink-700, #3A3E45)"/>
  <rect x="730" y="578" width="40" height="4" rx="2" fill="var(--color-ink-700, #3A3E45)"/>

  <!-- desktop slab -->
