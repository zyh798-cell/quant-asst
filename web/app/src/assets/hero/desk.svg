  <line x1="56" y1="562" x2="188" y2="562" stroke="var(--color-ink-700, #3A3E45)" stroke-width="2"/>
  <rect x="104" y="484" width="36" height="6" rx="3" fill="var(--color-ink-700, #3A3E45)"/>
  <rect x="104" y="534" width="36" height="6" rx="3" fill="var(--color-ink-700, #3A3E45)"/>
  <rect x="104" y="584" width="36" height="6" rx="3" fill="var(--color-ink-700, #3A3E45)"/>

  <!-- right leg -->
  <rect x="842" y="462" width="18" height="150" rx="3" fill="var(--color-ink-800, #23262B)"/>

  <!-- tower case -->
  <rect x="716" y="470" width="92" height="142" rx="7" fill="var(--color-ink-800, #23262B)"/>
  <rect x="730" y="486" width="5" height="66" rx="2.5" fill="var(--color-accent, #18A67C)"/>
